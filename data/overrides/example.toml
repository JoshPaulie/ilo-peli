# Example: Customizing a word with overrides
# 
# To override a word, create a <word>.toml file in this directory.
# Overrides follow the same schema as word metadata in lipu-linku/sona.
#
# Common fields:
# - definition_en: Custom English definition
# - semantic_space_en: Custom semantic space description
# - source_language: Language the word was borrowed from
# - usage_category: "core", "common", "uncommon", "rare", "obsolete", etc.
# - creator: ["jan Name"] - who created the word
# - coined_era: "pre-pu", "post-pu", "post-ku"
# - deprecated: true/false
#
# Sections:
# - [[audio]]: List of audio pronunciations
#   - author: Who recorded it
#   - link: URL to the audio file
# - [[etymology]]: Etymology information
#   - word: The word this was derived from
# - [pu_verbatim]: Definitions in multiple languages
#   - en: English definition
#   - de, eo, fr, etc.: Other languages
# - [representations]: Visual representations
#   - emoji: Emoji representation
#   - sitelen_sitelen: URL to sitelen sitelen image
# - [ku_data]: Usage percentages (0-100)
#   - translation_key: percentage

# Example: Override for "sina" to add pronoun note
# id = "sina"
# word = "sina"
# [pu_verbatim]
# en = "PRONOUN you"
#
# [[etymology]]
# word = "Malay"
